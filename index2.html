<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>15 Aug 2026 — Photo Gallery (Odisha, Puri, Digha, Gopalpur, Mandarmani)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PHOTO GALLERY — LUXURY EDITORIAL & MOBILE MASONRY
   ============================================================ */

:root {
  /* Light Theme (Editorial Magazine) */
  --page-bg: #ecece9;
  --shell-bg: #ffffff;
  --tile-bg: #f2f2ef;
  --ink: #111110;
  --ink-soft: #666660;
  --ink-muted: #94948c;
  --line: #e6e6e0;
  --pill-bg: #f4f4f1;
  --pill-border: #e2e2dc;
  --btn-glass: rgba(255, 255, 255, 0.85);
  --btn-glass-border: rgba(255, 255, 255, 0.4);
  --shadow-shell: 0 4px 24px rgba(0, 0, 0, 0.04);
  --shadow-card: 0 10px 28px rgba(0, 0, 0, 0.08);

  --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --radius-shell: 36px;
  --radius-tile: 22px;
  --radius-tile-mobile: 18px;
  --gap: 16px;
}

[data-theme="dark"] {
  /* Dark Theme (Mobile App Aesthetic) */
  --page-bg: #09080c;
  --shell-bg: #121017;
  --tile-bg: #1d1a24;
  --ink: #f7f6f9;
  --ink-soft: #a39fb0;
  --ink-muted: #6e697d;
  --line: #272333;
  --pill-bg: #1c1926;
  --pill-border: #2e2a3d;
  --btn-glass: rgba(35, 30, 46, 0.82);
  --btn-glass-border: rgba(255, 255, 255, 0.12);
  --shadow-shell: 0 8px 32px rgba(0, 0, 0, 0.45);
  --shadow-card: 0 12px 28px rgba(0, 0, 0, 0.35);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background-color: var(--page-bg);
  color: var(--ink);
  font-family: var(--font-main);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding: 28px 18px 60px;
  min-height: 100vh;
  transition: background-color 0.3s ease, color 0.3s ease;
}

/* ---------- Container Shell ---------- */
.shell {
  max-width: 1200px;
  margin: 0 auto;
  background-color: var(--shell-bg);
  border-radius: var(--radius-shell);
  padding: 34px 44px 50px;
  box-shadow: var(--shadow-shell);
  border: 1px solid var(--line);
  transition: background-color 0.3s ease, border-color 0.3s ease;
  position: relative;
}

/* ---------- Navigation ---------- */
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 24px;
}

.brand {
  font-weight: 800;
  font-size: 1.22rem;
  letter-spacing: -0.025em;
  color: var(--ink);
  text-decoration: none;
}

.based {
  color: var(--ink-soft);
  font-size: 0.9rem;
  font-weight: 450;
  letter-spacing: -0.01em;
}

.based b {
  color: var(--ink);
  font-weight: 650;
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--pill-bg);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}

.btn-icon:hover {
  transform: scale(1.08);
  background: var(--tile-bg);
}

.btn-icon svg {
  width: 18px;
  height: 18px;
  stroke: currentColor;
}

/* ---------- Hero Section (Visible on both Desktop & Mobile) ---------- */
.hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 28px;
  padding: 10px 0 26px;
  flex-wrap: wrap;
}

.hero-left {
  max-width: 520px;
}

.pill-badge {
  display: inline-block;
  font-size: 0.76rem;
  font-weight: 600;
  color: var(--ink-soft);
  background: var(--pill-bg);
  border: 1px solid var(--pill-border);
  padding: 6px 15px;
  border-radius: 999px;
  margin-bottom: 14px;
  letter-spacing: 0.01em;
}

.hero h1 {
  margin: 0;
  font-size: clamp(2.4rem, 5.2vw, 3.8rem);
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1.05;
  color: var(--ink);
}

.hero-sub {
  color: var(--ink-soft);
  font-size: 0.94rem;
  line-height: 1.6;
  max-width: 44ch;
  text-align: right;
  margin: 0 0 6px;
}

/* ---------- Photo Counter Bar ---------- */
.gallery-status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 16px;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--line);
}

.photo-count-label {
  font-size: 0.84rem;
  color: var(--ink-muted);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   BENTO GALLERY (Desktop: 3-Col Bento / Mobile: 2-Col Masonry)
   ============================================================ */

.gallery-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: 290px;
  gap: var(--gap);
  grid-auto-flow: dense;
}

.card {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-tile);
  background-color: var(--tile-bg);
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
  transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.35s ease;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-card);
}

.card img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
  display: block;
}

.card:hover img {
  transform: scale(1.04);
}

/* Shimmer Loading Skeleton */
.card .shimmer {
  position: absolute;
  inset: 0;
  background: linear-gradient(105deg, var(--tile-bg) 25%, var(--line) 50%, var(--tile-bg) 75%);
  background-size: 200% 100%;
  animation: shimmerAnim 1.5s infinite;
  z-index: 1;
  pointer-events: none;
  transition: opacity 0.35s ease;
}

@keyframes shimmerAnim {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.card.loaded .shimmer {
  opacity: 0;
}

/* Minimal Subtle Download Icon on Card Hover (Desktop only) */
.card-dl-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: translateY(-4px);
  transition: all 0.2s ease;
  z-index: 2;
  text-decoration: none;
}

.card:hover .card-dl-btn {
  opacity: 1;
  transform: translateY(0);
}

.card-dl-btn:hover {
  transform: scale(1.1);
  background: #ffffff;
}

/* ============================================================
   DESKTOP ASYMMETRIC BENTO RHYTHM
   ============================================================ */
.card:nth-child(7n+1) {
  grid-column: span 2;
  grid-row: span 1;
}
.card:nth-child(7n+2) {
  grid-column: span 1;
  grid-row: span 1;
}
.card:nth-child(7n+3) {
  grid-column: span 1;
  grid-row: span 1;
}
.card:nth-child(7n+4) {
  grid-column: span 1;
  grid-row: span 1;
}
.card:nth-child(7n+5) {
  grid-column: span 1;
  grid-row: span 1;
}
.card:nth-child(7n+6) {
  grid-column: span 1;
  grid-row: span 1;
}
.card:nth-child(7n) {
  grid-column: span 2;
  grid-row: span 1;
}

/* ============================================================
   MOBILE / RESPONSIVE UI (Clean, Heading & Description Included)
   ============================================================ */

@media (max-width: 820px) {
  body {
    padding: 12px 10px 40px;
  }

  .shell {
    padding: 22px 16px 36px;
    border-radius: 26px;
  }

  .nav {
    padding-bottom: 18px;
  }

  .based {
    font-size: 0.82rem;
  }

  /* Responsive Hero Section on Mobile */
  .hero {
    display: flex !important;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    padding: 4px 0 20px;
  }

  .hero h1 {
    font-size: 2.2rem;
    line-height: 1.1;
  }

  .hero-sub {
    text-align: left;
    font-size: 0.88rem;
    line-height: 1.55;
    max-width: 100%;
    margin: 0;
  }

  .gallery-status-bar {
    display: flex;
    padding-bottom: 12px;
    margin-bottom: 16px;
  }

  /* 2-Column True Masonry matching Phone UI */
  .gallery-container {
    display: block !important;
    columns: 2;
    column-gap: 12px;
  }

  .card {
    break-inside: avoid;
    margin-bottom: 12px;
    border-radius: var(--radius-tile-mobile);
    position: relative;
    overflow: hidden;
    height: auto !important;
    aspect-ratio: unset !important;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
  }

  .card:nth-child(n) {
    grid-column: unset !important;
    grid-row: unset !important;
  }

  .card img {
    position: static !important;
    width: 100% !important;
    height: auto !important;
    display: block !important;
  }

  .card-dl-btn {
    display: none;
  }
}

/* ============================================================
   FULL-SCREEN LIGHTBOX
   ============================================================ */

.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(8, 7, 10, 0.96);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  user-select: none;
}

.lightbox.open {
  opacity: 1;
  pointer-events: auto;
}

/* Top Bar */
.lb-top-bar {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 16px 20px;
  z-index: 1002;
}

.lb-close-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s ease, background 0.2s ease;
}

.lb-close-btn:hover {
  background: rgba(255, 255, 255, 0.24);
  transform: scale(1.08);
}

/* Stage */
.lb-stage {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 16px;
  position: relative;
  overflow: hidden;
}

.lb-img {
  max-width: min(92vw, 1100px);
  max-height: calc(100vh - 160px);
  object-fit: contain;
  border-radius: 16px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.65);
  transform: scale(0.97);
  transition: transform 0.25s ease;
}

.lightbox.open .lb-img {
  transform: scale(1);
}

/* Side Arrows (Desktop only) */
.lb-nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
  z-index: 1002;
}

.lb-nav-btn:hover {
  background: rgba(255, 255, 255, 0.24);
  transform: translateY(-50%) scale(1.08);
}

.lb-prev { left: 24px; }
.lb-next { right: 24px; }

/* Bottom Bar */
.lb-bottom-bar {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 16px 20px 24px;
  z-index: 1002;
}

.lb-counter-pill {
  color: #ffffff;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 9px 20px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.lb-dl-btn {
  color: #111111;
  background: #ffffff;
  padding: 9px 22px;
  border-radius: 999px;
  text-decoration: none;
  font-weight: 650;
  font-size: 0.85rem;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  transition: transform 0.2s ease, background 0.2s ease;
}

.lb-dl-btn:hover {
  transform: scale(1.05);
  background: #f5f5f5;
}

/* Mobile Quick Nav in Bottom Bar */
.lb-mobile-nav {
  display: none;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

@media (max-width: 820px) {
  .lb-nav-btn {
    display: none !important;
  }

  .lb-mobile-nav {
    display: flex;
  }

  .lb-top-bar {
    padding: 12px 14px;
  }

  .lb-close-btn {
    width: 40px;
    height: 40px;
  }

  .lb-stage {
    padding: 0 10px;
  }

  .lb-img {
    max-width: 96vw;
    max-height: calc(100vh - 140px);
    border-radius: 12px;
  }

  .lb-bottom-bar {
    gap: 10px;
    padding: 10px 14px calc(env(safe-area-inset-bottom, 12px) + 12px);
  }

  .lb-counter-pill {
    padding: 8px 14px;
    font-size: 0.78rem;
  }

  .lb-dl-btn {
    padding: 8px 16px;
    font-size: 0.78rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

  <div class="shell">

    <!-- Top Navigation -->
    <nav class="nav">
      <div>
        <a href="#" class="brand">15 Aug 2026</a>
      </div>

      <div class="based">
        Based in: <b>Odisha</b>
      </div>

      <div class="nav-right">
        <!-- Clean Dark / Light Mode Toggle Button -->
        <button class="btn-icon" id="desktopThemeBtn" title="Toggle Dark / Light Mode" aria-label="Toggle Dark / Light Mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
      </div>
    </nav>

    <!-- Hero Section (Visible on both Mobile & Desktop) -->
    <section class="hero">
      <div class="hero-left">
        <span class="pill-badge">Our Stories</span>
        <h1>Photo Gallery</h1>
      </div>
      <p class="hero-sub">
        Captured moments from our travels across Mahendragiri (Odisha), Puri, Gopalpur (Odisha), Digha, and Mandarmani.
      </p>
    </section>

    <!-- Status Bar (Photograph Count) -->
    <div class="gallery-status-bar">
      <span class="photo-count-label" id="photoCountLabel">Loading photographs…</span>
    </div>

    <!-- Gallery (Desktop 3-Col Bento / Mobile 2-Col Masonry) -->
    <main id="gallery" class="gallery-container" aria-live="polite"></main>

  </div>

  <!-- Full-Screen Lightbox Modal -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
    <!-- Top Bar with Close Button -->
    <div class="lb-top-bar">
      <button class="lb-close-btn" id="lbClose" aria-label="Close Lightbox">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Center Stage with Image and Desktop Gutter Arrows -->
    <div class="lb-stage" id="lbStage">
      <button class="lb-nav-btn lb-prev" id="lbPrev" aria-label="Previous Photo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>

      <img class="lb-img" id="lbImg" src="" alt="Enlarged photo view" />

      <button class="lb-nav-btn lb-next" id="lbNext" aria-label="Next Photo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>

    <!-- Bottom Bar with Mobile Navigation, Single-line Counter and Download -->
    <div class="lb-bottom-bar">
      <button class="lb-mobile-nav" id="lbMobilePrev" aria-label="Previous Photo">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>

      <div class="lb-counter-pill" id="lbCounter">001 / 859</div>

      <a class="lb-dl-btn" id="lbDownload" download>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>
        Download
      </a>

      <button class="lb-mobile-nav" id="lbMobileNext" aria-label="Next Photo">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // Build accurate list of 859 images with exact casing (1-144 JPG, 145-859 jpg)
  const TOTAL_PHOTOS = 859;
  const photoList = [];
  for (let i = 1; i <= TOTAL_PHOTOS; i++) {
    const ext = (i <= 144) ? "JPG" : "jpg";
    const filename = `img (${i}).${ext}`;
    photoList.push({
      id: i,
      filename: filename,
      src: './' + encodeURI(filename),
      status: 'pending'
    });
  }

  const galleryEl = document.getElementById("gallery");
  const countLabel = document.getElementById("photoCountLabel");

  // Lightbox elements
  const lightbox = document.getElementById("lightbox");
  const lbImg = document.getElementById("lbImg");
  const lbStage = document.getElementById("lbStage");
  const lbCounter = document.getElementById("lbCounter");
  const lbDownload = document.getElementById("lbDownload");
  const lbClose = document.getElementById("lbClose");
  const lbPrev = document.getElementById("lbPrev");
  const lbNext = document.getElementById("lbNext");
  const lbMobilePrev = document.getElementById("lbMobilePrev");
  const lbMobileNext = document.getElementById("lbMobileNext");

  // Theme Toggle
  const desktopThemeBtn = document.getElementById("desktopThemeBtn");

  let currentIdx = 0;
  let renderedCount = 0;
  const BATCH_SIZE = 40;

  // Create clean card
  function createCard(photo, index) {
    const card = document.createElement("figure");
    card.className = "card";
    card.setAttribute("data-id", photo.id);
    card.setAttribute("role", "button");
    card.setAttribute("tabindex", "0");
    card.setAttribute("aria-label", `View photo ${photo.id}`);

    // Skeleton shimmer
    const shimmer = document.createElement("div");
    shimmer.className = "shimmer";
    card.appendChild(shimmer);

    // Image
    const img = document.createElement("img");
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = `Gallery photo ${photo.id}`;
    img.src = photo.src;

    // Desktop hover download button
    const dlBtn = document.createElement("a");
    dlBtn.className = "card-dl-btn";
    dlBtn.href = photo.src;
    dlBtn.download = photo.filename;
    dlBtn.title = "Download";
    dlBtn.innerHTML = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>`;
    dlBtn.addEventListener("click", (e) => e.stopPropagation());

    card.appendChild(img);
    card.appendChild(dlBtn);

    img.addEventListener("load", () => {
      card.classList.add("loaded");
      photo.status = "loaded";
    });

    img.addEventListener("error", () => {
      photo.status = "failed";
      card.style.display = "none";
    });

    card.addEventListener("click", () => openLightbox(index));
    card.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openLightbox(index);
      }
    });

    return card;
  }

  // Render batch
  function renderBatch(count = BATCH_SIZE) {
    const nextLimit = Math.min(renderedCount + count, photoList.length);
    const fragment = document.createDocumentFragment();

    for (let i = renderedCount; i < nextLimit; i++) {
      fragment.appendChild(createCard(photoList[i], i));
    }

    galleryEl.appendChild(fragment);
    renderedCount = nextLimit;

    countLabel.textContent = `${photoList.length} photographs`;
  }

  // Initial render
  renderBatch(BATCH_SIZE);

  // Progressive infinite scroll
  window.addEventListener("scroll", () => {
    if (renderedCount < photoList.length) {
      const scrollPos = window.innerHeight + window.scrollY;
      const threshold = document.documentElement.scrollHeight - 600;
      if (scrollPos >= threshold) {
        renderBatch(BATCH_SIZE);
      }
    }
  }, { passive: true });

  // Lightbox Implementation
  function openLightbox(index) {
    currentIdx = index;
    updateLightbox();
    lightbox.classList.add("open");
    lightbox.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }

  function closeLightbox() {
    lightbox.classList.remove("open");
    lightbox.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }

  function updateLightbox() {
    const photo = photoList[currentIdx];
    if (!photo) return;
    lbImg.src = photo.src;
    lbCounter.textContent = `${String(currentIdx + 1).padStart(3, "0")} / ${String(photoList.length).padStart(3, "0")}`;
    lbDownload.href = photo.src;
    lbDownload.download = photo.filename;
  }

  function stepLightbox(delta) {
    currentIdx = (currentIdx + delta + photoList.length) % photoList.length;
    updateLightbox();
  }

  lbClose.addEventListener("click", closeLightbox);
  lbPrev.addEventListener("click", () => stepLightbox(-1));
  lbNext.addEventListener("click", () => stepLightbox(1));
  lbMobilePrev.addEventListener("click", () => stepLightbox(-1));
  lbMobileNext.addEventListener("click", () => stepLightbox(1));

  // Close when clicking outside the image
  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox || e.target === lbStage) {
      closeLightbox();
    }
  });

  // Tap left/right 30% of screen to navigate on touch/click
  lbStage.addEventListener("click", (e) => {
    if (e.target === lbImg) {
      const rect = lbImg.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if (clickX < rect.width * 0.3) {
        stepLightbox(-1);
      } else if (clickX > rect.width * 0.7) {
        stepLightbox(1);
      }
    }
  });

  document.addEventListener("keydown", (e) => {
    if (!lightbox.classList.contains("open")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") stepLightbox(-1);
    if (e.key === "ArrowRight") stepLightbox(1);
  });

  // Mobile Touch Swipe for Lightbox
  let touchStartX = null;
  lightbox.addEventListener("touchstart", (e) => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });

  lightbox.addEventListener("touchend", (e) => {
    if (touchStartX === null) return;
    const diff = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(diff) > 45) {
      stepLightbox(diff > 0 ? -1 : 1);
    }
    touchStartX = null;
  }, { passive: true });

  // Theme Toggle Functionality
  function toggleTheme() {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    const nextTheme = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nextTheme);
    try {
      localStorage.setItem("gallery-theme", nextTheme);
    } catch(e){}
  }

  desktopThemeBtn.addEventListener("click", toggleTheme);

  // Restore saved theme
  try {
    const saved = localStorage.getItem("gallery-theme");
    if (saved) {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch(e){}

})();
</script>
</body>
</html>
